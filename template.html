<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://push.nexuscore.trade https://cloudflareinsights.com; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0C2237">
{{HEAD}}
<link rel="icon" href="/assets/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXUS CORE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="/style.css?v=20261123d">
<script src="/theme.js?v=20261123d"></script>
</head>
<body data-page="{{KIND}}">
<a class="skip" href="#app" data-i18n="skip"></a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="{{HOME}}"><picture><source type="image/webp" srcset="/assets/logo-head.webp"><img src="/assets/logo-head.png" alt="NEXUS CORE" width="222" height="46"></picture></a>
    <nav class="tabs" aria-label="Main">
      <a href="{{TODAY}}" data-tab="plan" data-i18n="tab_plan"></a>
      <a href="{{TRACK}}" data-tab="track" data-i18n="tab_history"></a>
      <a href="{{EA}}" data-tab="ea" data-i18n="tab_ea"></a>
      <a href="{{LEARN}}" data-tab="learn" data-i18n="tab_learn"></a>
      <a href="{{SIGNALS}}" data-tab="signals" data-i18n="tab_signals"></a>
    </nav>
    <div class="top-right">
      <span class="live" id="live"><span class="dot"></span><span id="live-text">LIVE</span></span>
      <button type="button" class="theme" id="theme-btn" aria-label="Theme">
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <details class="lang-dd" id="lang-dd">
        <summary aria-label="Language"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span>{{LANGCODE}}</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="lang" role="group" aria-label="Language">
          <a role="button" href="/" data-lang="en" lang="en" hreflang="en">English</a>
          <a role="button" href="/ar/" data-lang="ar" lang="ar" hreflang="ar">العربية</a>
          <a role="button" href="/vi/" data-lang="vi" lang="vi" hreflang="vi">Tiếng Việt</a>
          <a role="button" href="/zh-hant/" data-lang="zh-hant" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a>
        </div>
      </details>
      <a class="get-alerts" href="#cta">{{C:alerts_btn}}</a>
    </div>
  </div>
</header>

<main class="wrap" id="app">
<!-- VIEW -->
  <section id="view-plan">
    <div class="plan-head">
      <div>
        <p class="eyebrow" id="plan-meta"></p>
        <h1 id="plan-title"></h1>
        <a class="permalink" id="plan-link" href="#" hidden></a>
      </div>
      <div class="editions" id="editions" aria-label="Plan update times"></div>
    </div>

    <div class="alert" id="alert" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="al" id="alert-text"></div>
    </div>

    <div class="sum">
      <div class="hero card" id="bias-card">
        <div class="hero-top"><p class="eyebrow" data-i18n="bias"></p><span class="mchip" id="main-chip"></span></div>
        <p class="bias-val" id="bias-val"></p>
        <div class="headline" id="headline"></div>
        <p class="bias-sub" id="day-type"></p>
        <div class="hero-keys" id="hero-keys"></div>
      </div>
      <figure class="chart" id="chart-box" hidden>
        <a id="chart-link" href="#" target="_blank" rel="noopener noreferrer"><picture><source id="chart-mw" type="image/webp" media="(max-width: 640px)" width="1200" height="1500"><source id="chart-m" media="(max-width: 640px)" width="1200" height="1500"><source id="chart-w" type="image/webp" width="1800" height="1110"><img id="chart-img" alt="" loading="lazy" width="1800" height="1110"></picture></a>
        <figcaption class="chart-hint" data-i18n="chart_hint"></figcaption>
      </figure>
    </div>

    <div class="card result" id="result" hidden></div>

    <div class="ptabs-bar">
      <div class="ptabs" id="ptabs" role="tablist" aria-label="{{C:tabs_label}}">
        <button type="button" role="tab" id="t-scen" aria-controls="p-scen" data-p="scen">{{C:tab_scen}}</button>
        <button type="button" role="tab" id="t-levels" aria-controls="p-levels" data-p="levels">{{C:tab_levels}}</button>
        <button type="button" role="tab" id="t-zones" aria-controls="p-zones" data-p="zones">{{C:tab_zones}}</button>
        <button type="button" role="tab" id="t-context" aria-controls="p-context" data-p="context">{{C:tab_context}}</button>
        <button type="button" role="tab" id="t-news" aria-controls="p-news" data-p="news">{{C:tab_news}}</button>
      </div>
    </div>

    <div class="panels" id="panels">
      <div class="panel" id="p-scen" role="tabpanel" aria-labelledby="t-scen" tabindex="0">
        <h2 data-i18n="scenarios"></h2>
        <div id="scenarios" class="pgrid"></div>
      </div>
      <div class="panel" id="p-levels" role="tabpanel" aria-labelledby="t-levels" tabindex="0">
        <h2 data-i18n="levels"></h2>
        <div class="card list" id="levels"></div>
      </div>
      <div class="panel" id="p-zones" role="tabpanel" aria-labelledby="t-zones" tabindex="0">
        <h2 data-i18n="zones"></h2>
        <div id="zones" class="pgrid"></div>
      </div>
      <div class="panel" id="p-context" role="tabpanel" aria-labelledby="t-context" tabindex="0">
        <h2>{{C:tab_context}}</h2>
        <div class="stats" id="context"></div>
      </div>
      <div class="panel" id="p-news" role="tabpanel" aria-labelledby="t-news" tabindex="0">
        <h2 data-i18n="news"></h2>
        <div class="card list" id="news"></div>
        <p class="tznote muted" id="tznote"></p>
      </div>
    </div>

    <div class="next" id="next"></div>
    <a class="proof" id="proof" href="#" hidden></a>
    <nav class="pnav" id="pnav" hidden></nav>
  </section>

<!-- /VIEW -->

  <!-- CTA: on every page -->
  <section class="cta-box" id="cta" aria-labelledby="cta-h">
    <div class="cta-head">
      <h2 id="cta-h" data-i18n="cta_title"></h2>
      <p data-i18n="cta_sub"></p>
    </div>
    <div class="cta-grid">
      <div class="notify js-notify" hidden>
        <div class="notify-t"><strong data-i18n="cta_push"></strong><span class="notify-sub"></span></div>
        <button type="button" class="btn big notify-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2zM10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="notify-btn-t"></span>
        </button>
      </div>
      <div class="wl js-wl" data-topic="plan">
        <div class="wl-t"><strong data-i18n="wl_title"></strong><span data-i18n="wl_sub"></span></div>
        <form class="wl-form" novalidate>
          <label class="sr" for="wl-email" data-i18n="wl_label"></label>
          <input type="email" id="wl-email" class="wl-email" name="email" autocomplete="email" inputmode="email" maxlength="254" required>
          <input type="text" class="hp wl-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit" class="btn solid wl-btn" data-i18n="wl_btn"></button>
        </form>
        <p class="wl-msg" role="status" aria-live="polite"></p>
        <p class="wl-note muted" data-i18n="wl_privacy"></p>
      </div>
    </div>
    <a class="cta js-tg" href="https://t.me/nexuscorefx" target="_blank" rel="noopener noreferrer" id="tg-cta">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span><strong data-i18n="tg_title"></strong><span data-i18n="tg_sub"></span></span>
    </a>
  </section>
</main>

{{FOOTER}}

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Chart">
  <button type="button" class="lb-x" id="lb-x" aria-label="Close">×</button>
  <img id="lb-img" alt="">
  <p class="lb-hint" data-i18n="lb_hint"></p>
</div>

{{JSONLD}}
<script src="/app.js?v=20261123d" defer></script>
</body>
</html>
