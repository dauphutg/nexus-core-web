<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NEXUS CORE – XAUUSD daily plan</title>
<meta name="description" content="NEXUS CORE AI: XAUUSD daily plan, key zones and signals – updated automatically every trading day.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="NEXUS CORE – XAUUSD daily plan">
<meta property="og:image" content="assets/logo-banner.png">
<link rel="icon" href="assets/icon.png">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#plan"><img src="assets/logo-banner.png" alt="NEXUS CORE" width="222" height="46"></a>
    <div class="top-right">
      <span class="live"><span class="dot"></span>LIVE</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="vi">VI</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <nav class="wrap tabs" aria-label="Main">
    <a href="#plan" data-tab="plan" data-i18n="tab_plan"></a>
    <a href="#signals" data-tab="signals" data-i18n="tab_signals"></a>
    <a href="#history" data-tab="history" data-i18n="tab_history"></a>
  </nav>
</header>

<main class="wrap" id="app">
  <p class="muted" id="loading" data-i18n="loading"></p>

  <!-- PLAN -->
  <section id="view-plan" hidden>
    <div class="alert card" id="alert" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke="#8A5A00" stroke-width="2" stroke-linecap="round"/></svg>
      <p id="alert-text"></p>
    </div>

    <div class="plan-head">
      <div>
        <p class="eyebrow" id="plan-meta"></p>
        <h1 id="plan-title"></h1>
      </div>
    </div>

    <figure class="chart card" id="chart-box" hidden>
      <a id="chart-link" href="#" target="_blank" rel="noopener noreferrer"><img id="chart-img" alt="" loading="lazy"></a>
    </figure>

    <div class="grid-2">
      <div class="stack">
        <div class="bias card" id="bias-card">
          <div>
            <p class="eyebrow" data-i18n="bias"></p>
            <p class="bias-val" id="bias-val"></p>
          </div>
          <p class="bias-sub" id="day-type"></p>
        </div>
        <p class="headline" id="headline"></p>

        <div class="card list" id="levels"></div>

        <div class="stats" id="context"></div>
      </div>

      <div class="stack">
        <h2 data-i18n="scenarios"></h2>
        <div id="scenarios" class="stack-sm"></div>

        <h2 data-i18n="zones"></h2>
        <div id="zones" class="stack-sm"></div>

        <h2 data-i18n="news"></h2>
        <div class="card list" id="news"></div>

        <div class="card next" id="next"></div>
      </div>
    </div>
  </section>

  <!-- SIGNALS -->
  <section id="view-signals" hidden>
    <h1 data-i18n="tab_signals"></h1>
    <div class="seg" role="tablist" aria-label="Signal status">
      <button type="button" role="tab" data-seg="active" data-i18n="active"></button>
      <button type="button" role="tab" data-seg="closed" data-i18n="closed"></button>
    </div>
    <div id="signal-list" class="stack-sm"></div>
    <a class="card tg" href="https://t.me/nexuscorefx" target="_blank" rel="noopener noreferrer" id="tg-link">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z" fill="none" stroke="#1E2A4A" stroke-width="2" stroke-linejoin="round"/></svg>
      <span><strong data-i18n="tg_title"></strong><br><span class="muted" data-i18n="tg_sub"></span></span>
    </a>
  </section>

  <!-- HISTORY -->
  <section id="view-history" hidden>
    <h1 data-i18n="tab_history"></h1>
    <p class="muted" data-i18n="history_sub"></p>
    <div class="stats" id="hist-stats"></div>
    <div id="hist-list" class="stack-sm"></div>
  </section>
</main>

<footer class="wrap foot">
  <p data-i18n="disclaimer"></p>
  <p class="muted">© NEXUS CORE AI</p>
</footer>

<script src="app.js"></script>
</body>
</html>
