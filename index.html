<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://push.nexuscore.trade; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0C2237">
<title>NEXUS CORE — Gold (XAUUSD) daily plan &amp; signals</title>
<meta name="description" content="AI-built gold (XAUUSD) game plan with key zones, scenarios and invalidation levels — refreshed before the Asia, London and New York sessions. Free, every plan graded in public.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nexuscore.trade/">
<meta property="og:title" content="NEXUS CORE — Gold (XAUUSD) daily plan &amp; signals">
<meta property="og:description" content="Key zones, scenarios and invalidation levels for gold — refreshed before Asia, London and New York.">
<meta property="og:image" content="https://nexuscore.trade/assets/logo-banner.png">
<link rel="icon" href="assets/icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NEXUS CORE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=20261111i">
<script src="theme.js?v=20261111i"></script>
</head>
<body>
<a class="skip" href="#app" data-i18n="skip"></a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#plan"><img src="assets/logo-banner.png" alt="NEXUS CORE" width="222" height="46"></a>
    <div class="top-right">
      <span class="live" id="live"><span class="dot"></span><span id="live-text">LIVE</span></span>
      <button type="button" class="theme" id="theme-btn" aria-label="Theme">
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ar" lang="ar">عربي</button>
        <button type="button" data-lang="vi" lang="vi">VI</button>
      </div>
    </div>
  </div>
  <nav class="wrap tabs" aria-label="Main">
    <a href="#plan" data-tab="plan" data-i18n="tab_plan"></a>
    <a href="#signals" data-tab="signals" data-i18n="tab_signals"></a>
    <a href="#history" data-tab="history" data-i18n="tab_history"></a>
  </nav>
</header>

<main class="wrap" id="app">
  <p class="muted" id="loading" data-i18n="loading"></p>

  <!-- PLAN -->
  <section id="view-plan" hidden>
    <div class="plan-head">
      <div>
        <p class="eyebrow" id="plan-meta"></p>
        <h1 id="plan-title"></h1>
        <p class="lede" data-i18n="lede"></p>
      </div>
      <div class="editions" id="editions" aria-label="Plan update times"></div>
    </div>

    <div class="alert" id="alert" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4M12 17v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <p id="alert-text"></p>
    </div>

    <div class="hero card" id="bias-card">
      <div class="hero-bias">
        <p class="eyebrow" data-i18n="bias"></p>
        <p class="bias-val" id="bias-val"></p>
        <p class="bias-sub" id="day-type"></p>
      </div>
      <p class="headline" id="headline"></p>
      <div class="hero-keys" id="hero-keys"></div>
    </div>

    <div class="card notify" id="notify" hidden>
      <div class="notify-t"><strong data-i18n="nt_title"></strong><span id="notify-sub"></span></div>
      <button type="button" class="btn big" id="notify-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2zM10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="notify-btn-t"></span>
      </button>
      <div class="alt-ch">
        <span class="muted" data-i18n="nt_alt"></span>
        <a class="btn alt" id="nt-tg" href="https://t.me/nexuscorefx" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span data-i18n="nt_tg"></span>
        </a>
        <a class="btn alt" href="#waitlist" id="nt-mail">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span data-i18n="nt_mail"></span>
        </a>
      </div>
    </div>

    <div class="layout">
      <div class="stack">
        <figure class="chart" id="chart-box" hidden>
          <a id="chart-link" href="#" target="_blank" rel="noopener noreferrer"><img id="chart-img" alt="" loading="lazy" width="1800" height="1110"></a>
        </figure>
        <h2 data-i18n="zones"></h2>
        <div id="zones" class="stack-sm"></div>
      </div>

      <div class="stack">
        <h2 data-i18n="levels"></h2>
        <div class="card list" id="levels"></div>
        <div class="stats" id="context"></div>

        <h2 data-i18n="scenarios"></h2>
        <div id="scenarios" class="stack-sm"></div>

        <h2 data-i18n="news"></h2>
        <div class="card list" id="news"></div>
        <p class="tznote muted" id="tznote"></p>

        <div class="card next" id="next"></div>
      </div>
    </div>

    <div class="card wl" id="waitlist" hidden>
      <div class="wl-t"><strong data-i18n="wl_title"></strong><span data-i18n="wl_sub"></span></div>
      <form id="wl-form" novalidate>
        <label class="sr" for="wl-email" data-i18n="wl_label"></label>
        <input type="email" id="wl-email" name="email" autocomplete="email" inputmode="email" maxlength="254" required>
        <input type="text" id="wl-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
        <button type="submit" class="btn solid" id="wl-btn" data-i18n="wl_btn"></button>
      </form>
      <p class="wl-msg" id="wl-msg" role="status" aria-live="polite"></p>
      <p class="wl-note muted" data-i18n="wl_privacy"></p>
    </div>

    <a class="cta" id="tg-cta" href="https://t.me/nexuscorefx" target="_blank" rel="noopener noreferrer">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span><strong data-i18n="tg_title"></strong><span data-i18n="tg_sub"></span></span>
    </a>
  </section>

  <!-- SIGNALS -->
  <section id="view-signals" hidden>
    <h1 data-i18n="tab_signals"></h1>
    <p class="lede" data-i18n="signals_sub"></p>
    <div class="seg" role="tablist" aria-label="Signal status">
      <button type="button" role="tab" data-seg="active" data-i18n="active"></button>
      <button type="button" role="tab" data-seg="closed" data-i18n="closed"></button>
    </div>
    <div id="signal-list" class="stack-sm"></div>
    <a class="cta" id="tg-link" href="https://t.me/nexuscorefx" target="_blank" rel="noopener noreferrer">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span><strong data-i18n="tg_title"></strong><span data-i18n="tg_sub"></span></span>
    </a>
  </section>

  <!-- HISTORY -->
  <section id="view-history" hidden>
    <h1 data-i18n="tab_history"></h1>
    <p class="lede" data-i18n="history_sub"></p>
    <div class="stats" id="hist-stats"></div>
    <div id="hist-list" class="stack-sm"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div class="risk">
      <strong data-i18n="risk_title"></strong>
      <p data-i18n="disclaimer"></p>
    </div>
    <div class="foot-row">
      <span class="muted">© 2026 NEXUS CORE AI</span>
      <nav class="social" aria-label="Social">
        <a id="s-tg" href="https://t.me/nexuscorefx" target="_blank" rel="noopener noreferrer">Telegram</a>
        <a id="s-x" href="https://x.com/XAU_CRYPTO" target="_blank" rel="noopener noreferrer">X</a>
        <a id="s-yt" href="https://www.youtube.com/@nexuscorefx" target="_blank" rel="noopener noreferrer">YouTube</a>
      </nav>
    </div>
  </div>
</footer>

<script src="app.js?v=20261111i"></script>
</body>
</html>
